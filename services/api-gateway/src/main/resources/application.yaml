server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: catalog-openapi
              uri: ${CATALOG_SERVICE_URL:http://catalog-service:8082}
              predicates:
                - Path=/catalog/v3/api-docs/**
              filters:
                - PreserveHostHeader
                - RewritePath=/catalog/(?<segment>.*), /${segment}

            - id: auth-openapi
              uri: ${AUTH_SERVICE_URL:http://auth-service:8081}
              predicates:
                - Path=/auth-docs/v3/api-docs/**
              filters:
                - PreserveHostHeader
                - RewritePath=/auth-docs/(?<segment>.*), /${segment}

            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://auth-service:8081}
              predicates:
                - Path=/auth/**

            - id: catalog-service
              uri: ${CATALOG_SERVICE_URL:http://catalog-service:8082}
              predicates:
                - Path=/api/products/**

            - id: user-service
              uri: http://${SERVICE_HOST:user-service}:8083
              predicates:
                - Path=/api/user/**

            - id: cart-service
              uri: http://${SERVICE_HOST:cart-service}:8084
              predicates:
                - Path=/api/cart/**

            - id: order-service
              uri: http://${SERVICE_HOST:order-service}:8085
              predicates:
                - Path=/api/order/**

            - id: bonus-service
              uri: http://${SERVICE_HOST:bonus-service}:8086
              predicates:
                - Path=/api/bonus/**

            - id: notification-service
              uri: http://${SERVICE_HOST:notification-service}:8087
              predicates:
                - Path=/api/notification/**

springdoc:
  swagger-ui:
    urls:
      - name: catalog-service
        url: /catalog/v3/api-docs
      - name: auth-service
        url: /auth-docs/v3/api-docs
    urls-primary-name: catalog-service

jwt:
  secret: ${JWT_SECRET}
  issuer: ${JWT_ISSUER:auth-service}
