server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/auth/**

            - id: catalog-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/products/**

            - id: user-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/user/**

            - id: cart-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/cart/**

            - id: order-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/order/**

            - id: bonus-service
              uri: http://localhost:8086
              predicates:
                - Path=/api/bonus/**

            - id: notification-service
              uri: http://localhost:8087
              predicates:
                - Path=/api/notification/**