server:
  port: 8080

spring:
  application:
    name: catalog-service

  elasticsearch:
    uris: ${ELASTICSEARCH_URI:http://localhost:9200}
    connection-timeout: 2s
    socket-timeout: 3s
  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 500
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}

  datasource:
    url: ${CATALOG_DATABASE_URL:jdbc:postgresql://localhost:5432/catalog_db}
    username: ${CATALOG_DATABASE_USERNAME:postgres}
    password: ${CATALOG_DATABASE_PASSWORD:postgres}

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

resilience4j:
  circuitbreaker:
    instances:
      elasticsearch:
        slidingWindowSize: 20
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        timelimiter:
          instances:
            elasticsearch:
              timeoutDuration: 4s

springdoc:
  swagger-ui:
    path: /swagger-ui.html
